plugins {
    alias(libs.plugins.android.application)
    id("com.google.gms.google-services")
}

android {
    namespace 'com.example.proyecto_iot'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.proyecto_iot"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    packagingOptions {
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/mimetypes.default'  // Excluir el archivo conflictivo
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'   // Incluye esta línea adicional
        exclude 'META-INF/LICENSE'  // Incluye esta línea adicional
        exclude 'META-INF/mailcap.default'    // Nuevo archivo duplicado encontrado
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'com.google.android.material:material:1.8.0'

    // RecyclerView para mostrar la lista de pedidos
    implementation 'androidx.recyclerview:recyclerview:1.3.1'

    //material design 3
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    //libreria de graficos estadisticos
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    //Google Firebase
    implementation platform('com.google.firebase:firebase-bom:32.4.1')
    implementation("com.google.firebase:firebase-firestore")

    //Google Firebase Database
    implementation 'com.google.firebase:firebase-database'

    //Google Firebase Storage
    implementation 'com.google.firebase:firebase-storage'

    //Google Firebase Auth
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.firebaseui:firebase-ui-auth:7.2.0'

    //Google
    implementation 'com.google.android.gms:play-services-auth:20.4.1'

    implementation 'com.github.bumptech.glide:glide:4.14.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.14.2'
    implementation 'com.android.volley:volley:1.2.1'

    //Location
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // Maps SDK for Android
    implementation 'com.google.android.gms:play-services-maps:18.1.0'

    implementation 'com.google.android.gms:play-services-places:17.0.0'
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    implementation 'com.squareup.okhttp3:okhttp:4.11.0'



    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
    implementation 'org.eclipse.angus:angus-activation:2.0.1'




}
